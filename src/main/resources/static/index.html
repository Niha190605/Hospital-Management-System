<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hospital Management System</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Hospital Management System</h1>

    <!-- LOGIN -->
    <div class="card">
        <h2>Login</h2>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="loginMessage"></p>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" style="display:none;">

        <!-- PATIENT -->
        <div class="card">
            <h2>Add Patient</h2>

            <input type="text" id="patientName" placeholder="Patient Name">
            <input type="number" id="patientAge" placeholder="Patient Age">

            <button onclick="addPatient()">Add Patient</button>

            <button onclick="loadPatients()">Load Patients</button>

            <ul id="patientList"></ul>
        </div>

        <!-- DOCTOR -->
        <div class="card">
            <h2>Add Doctor</h2>

            <input type="text" id="doctorName" placeholder="Doctor Name">
            <input type="text" id="doctorSpecialization" placeholder="Specialization">
            <input type="number" id="doctorExperience" placeholder="Experience">

            <button onclick="addDoctor()">Add Doctor</button>

            <button onclick="loadDoctors()">Load Doctors</button>

            <ul id="doctorList"></ul>
        </div>

        <!-- APPOINTMENT -->
        <div class="card">
            <h2>Add Appointment</h2>

            <input type="date" id="appointmentDate">
            <input type="number" id="appointmentPatientId" placeholder="Patient ID">
            <input type="number" id="appointmentDoctorId" placeholder="Doctor ID">

            <button onclick="addAppointment()">Add Appointment</button>

            <button onclick="loadAppointments()">Load Appointments</button>

            <ul id="appointmentList"></ul>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
