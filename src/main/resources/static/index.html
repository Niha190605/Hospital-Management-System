<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Hospital Management System</h1>

    <!-- ================= PATIENT SECTION ================= -->

    <div class="card">

        <h2>Patients</h2>

        <input type="text" id="patientName" placeholder="Patient Name">

        <input type="number" id="patientAge" placeholder="Patient Age">

        <button onclick="addPatient()">
            Add Patient
        </button>

        <button onclick="loadPatients()">
            View Patients
        </button>

        <ul id="patientList"></ul>

    </div>



    <!-- ================= DOCTOR SECTION ================= -->

    <div class="card">

        <h2>Doctors</h2>

        <input type="text" id="doctorName" placeholder="Doctor Name">

        <input type="text" id="doctorSpecialization"
               placeholder="Specialization">

        <input type="number" id="doctorExperience"
               placeholder="Experience">

        <button onclick="addDoctor()">
            Add Doctor
        </button>

        <button onclick="loadDoctors()">
            View Doctors
        </button>

        <ul id="doctorList"></ul>

    </div>



    <!-- ================= APPOINTMENT SECTION ================= -->

    <div class="card">

        <h2>Appointments</h2>

        <input type="date" id="appointmentDate">

        <input type="number" id="appointmentPatientId"
               placeholder="Patient ID">

        <input type="number" id="appointmentDoctorId"
               placeholder="Doctor ID">

        <button onclick="addAppointment()">
            Add Appointment
        </button>

        <button onclick="loadAppointments()">
            View Appointments
        </button>

        <ul id="appointmentList"></ul>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
